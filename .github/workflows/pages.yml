name: Проверка и публикация Flutter Web
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Проверка номера версии
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import os
          import re
          from pathlib import Path
          text = Path('pubspec.yaml').read_text(encoding='utf-8-sig')
          version = re.search(r'^version:\s*([^\s+]+)', text, re.M).group(1)
          expected = 'v' + version
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit(f'Тег {actual} не совпадает с версией {expected} из pubspec.yaml')
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Проверка браузерного HTTP-клиента
        timeout-minutes: 5
        run: flutter test --platform chrome test/transport_client_web_test.dart
      - name: Сборка с путём репозитория
        env:
          REPOSITORY: ${{ github.event.repository.name }}
        shell: bash
        run: |
          base="/$REPOSITORY/"
          if [[ "$REPOSITORY" == *.github.io ]]; then base="/"; fi
          flutter build web --release --no-web-resources-cdn --base-href "$base"
      - name: Уникальные имена файлов для обновления кэша
        run: python tool/prepare_web_release.py
      - name: Метаданные публикации
        env:
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path
          text = Path('pubspec.yaml').read_text(encoding='utf-8-sig')
          version = re.search(r'^version:\s*(\S+)', text, re.M).group(1)
          Path('build/web/deployment.json').write_text(json.dumps({
              'version': version, 'commit': os.environ['COMMIT'], 'ref': os.environ['REF']
          }), encoding='utf-8')
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
